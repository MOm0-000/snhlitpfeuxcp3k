### model
model_name_or_path: models/Qwen3-4B-Instruct-2507
trust_remote_code: true
template: qwen3_nothink
flash_attn: sdpa

### quantization
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.0

### data
dataset: med_train_2k
eval_dataset: med_val_1k
dataset_dir: data/processed
cutoff_len: 1024
packing: false
max_samples: 2000
preprocessing_num_workers: 2
dataloader_num_workers: 0

### output
output_dir: runs/qwen3-4b-qlora-alpha32-align100
logging_steps: 1
save_steps: 50
save_total_limit: 2
save_only_model: true
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 1.0
max_steps: 100
lr_scheduler_type: cosine
warmup_steps: 20
weight_decay: 0.1
adam_beta2: 0.95
max_grad_norm: 1.0
optim: paged_adamw_8bit
bf16: true
fp16: false
gradient_checkpointing: true
seed: 23

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
